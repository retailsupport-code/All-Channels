<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Channel Wise Sales Summary</title>
<style>
  :root { --purple:#601f80; --light:#f3ecf7; --green:#1b8a3a; --red:#c62828; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:Cambria, 'Times New Roman', serif; background:#f7f7f9; color:#222; }
  header { background:var(--purple); color:#fff; display:flex; align-items:center; gap:18px;
           padding:12px 24px; flex-wrap:wrap; }
  header img { height:100px; filter:contrast(1.25) drop-shadow(0 0 .7px #fff) drop-shadow(0 0 .7px #fff); }
  header h1 { margin:0; font-size:26px; font-weight:600; flex:1; }
  .filter { display:flex; align-items:center; gap:8px; font-size:14px; }
  .filter select { font-family:Cambria, 'Times New Roman', serif; padding:7px 12px; border-radius:6px; border:none; font-size:15px; }
  main { padding:20px 24px; max-width:1200px; margin:auto; }
  .card { background:#fff; border-radius:8px; box-shadow:0 1px 4px rgba(0,0,0,.12);
          margin-bottom:24px; overflow-x:auto; }
  table { border-collapse:collapse; width:100%; font-size:15px; font-family:Cambria, 'Times New Roman', serif; }
  th { background:var(--purple); color:#fff; padding:10px 12px; text-align:right; white-space:nowrap; }
  td { padding:9px 12px; text-align:right; border-bottom:1px solid #eee; white-space:nowrap; }
  th:first-child, td:first-child { text-align:left; font-weight:600; }
  tr.total td { background:var(--light); font-weight:700; border-top:2px solid var(--purple); }
  .pos { color:var(--green); font-weight:600; } .neg { color:var(--red); font-weight:600; }
  #msg { padding:14px 24px; color:var(--red); }
  footer { text-align:center; font-size:12px; color:#777; padding-bottom:20px; }
</style>
</head>

function parseCSV(text) {
  const rows = []; let row = [], cur = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i+1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true;
    else if (c === ",") { row.push(cur); cur = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && text[i+1] === "\n") i++; row.push(cur); rows.push(row); row = []; cur = ""; }

  }
  if (cur !== "" || row.length) { row.push(cur); rows.push(row); }
  return rows;
}

  const map = {};
  rows.slice(1).forEach(r => {
    const name = (r[0] || "").trim().toLowerCase();
    if (!name || name === "total") return;
    map[name] = Array.from({length: 12}, (_, i) => num(r[i + 1]));
  });
  return map;
}
// Dashboard channel data -> { channel: [12 numbers], Total: [12 numbers] }
function byChannel(map) {
  const out = {}; const total = Array(12).fill(0);
  for (const [ch, names] of Object.entries(CHANNELS)) {
    out[ch] = Array(12).fill(0);
    names.forEach(n => (map[n] || []).forEach((v, i) => { out[ch][i] += v; }));
    out[ch].forEach((v, i) => total[i] += v);
  }
  out.Total = total;
  return out;
}

const fmt = n => Math.round(n).toLocaleString("en-IN");
const pct = (a, b) => b ? (a / b - 1) * 100 : null;      // growth
const ratio = (a, b) => b ? a / b * 100 : null;          // achievement
const pcell = (v, signed) => {
  if (v === null) return "<td>-</td>";
  const cls = signed ? (v >= 0 ? "pos" : "neg") : (v >= 100 ? "pos" : "neg");
  return `<td class="${cls}">${v.toFixed(1)}%</td>`;
};
const sum = (arr, to) => arr.slice(0, to + 1).reduce((a, b) => a + b, 0);

let D = {};

function render() {
  const m = +document.getElementById("month").value;
  const n = m + 1;                       // next month index
  const hasNext = n <= 11;
  const FY = FY_START_YEAR;
  const chs = [...Object.keys(CHANNELS), "Total"];

  // Table 1
  let h = `<thead><tr><th>Channels</th><th>${lbl(m,FY)} Target</th><th>${lbl(m,FY)} Ach</th><th>Ach%</th>
    <th>${lbl(m,FY-1)} Sale</th><th>Growth</th><th>YTD ${FY}</th><th>YTD ${FY-1}</th><th>YoY%</th></tr></thead><tbody>`;
  chs.forEach(c => {
    const tg = D.target[c][m], ach = D.sale26[c][m], ly = D.sale25[c][m];
    const y26 = sum(D.sale26[c], m), y25 = sum(D.sale25[c], m);
    h += `<tr class="${c==="Total"?"total":""}"><td>${c}</td><td>${fmt(tg)}</td><td>${fmt(ach)}</td>${pcell(ratio(ach,tg),false)}
      <td>${fmt(ly)}</td>${pcell(pct(ach,ly),true)}<td>${fmt(y26)}</td><td>${fmt(y25)}</td>${pcell(pct(y26,y25),true)}</tr>`;
  });
  document.getElementById("t1").innerHTML = h + "</tbody>";

  // Table 2
  const nm = hasNext ? MONTHS[n] : "Next";
  const nY = hasNext ? yr(n, FY) : FY;
  h = `<thead><tr><th>Channels</th><th>${lbl(m,FY)} Sales</th><th>${nm}'${String(nY-1).slice(2)} Sales</th>
    <th>${nm}'${String(nY).slice(2)} Target</th><th>YoY%</th></tr></thead><tbody>`;
  chs.forEach(c => {
    const cur = D.sale26[c][m];
    const ly = hasNext ? D.sale25[c][n] : null, tg = hasNext ? D.target[c][n] : null;
    h += `<tr class="${c==="Total"?"total":""}"><td>${c}</td><td>${fmt(cur)}</td>
      <td>${ly===null?"-":fmt(ly)}</td><td>${tg===null?"-":fmt(tg)}</td>${hasNext?pcell(pct(tg,ly),true):"<td>-</td>"}</tr>`;
  });
  document.getElementById("t2").innerHTML = h + "</tbody>";
}

async function load() {
  try {
    const bust = "&_=" + Date.now();
    const [a, b, c] = await Promise.all(
      Object.values(URLS).map(u => fetch(u + bust).then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })));
    D.sale26 = byChannel(toMap(a));
    D.sale25 = byChannel(toMap(b));
    D.target = byChannel(toMap(c));

    const sel = document.getElementById("month");
    MONTHS.forEach((mn, i) => sel.add(new Option(lbl(i, FY_START_YEAR), i)));
    // default = latest month that has 2026 sales
    let last = 0; D.sale26.Total.forEach((v, i) => { if (v > 0) last = i; });
    sel.value = last;
    sel.onchange = render;
    render();
    document.getElementById("updated").textContent = "Data refreshed: " + new Date().toLocaleString("en-IN");
  } catch (e) {
    document.getElementById("msg").textContent = "Could not load data from Google Sheets (" + e.message + "). Check that the sheet is published to the web.";
  }
}
load();
</script>
